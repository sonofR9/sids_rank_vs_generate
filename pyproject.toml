[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sids-rank-vs-generate"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [ "numpy", "polars", "scikit-learn", "kagglehub", ]

[project.scripts]
sasrec-baseline = "sids_rank_vs_generate.experiments.sasrec:main"
sasrec-train = "sids_rank_vs_generate.experiments.sasrec:main"

[tool.setuptools.packages.find]
where = ["src"]

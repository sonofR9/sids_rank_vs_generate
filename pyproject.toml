[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sids-rank-vs-generate"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.30",
    "numpy>=1.26",
    "polars>=1.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "torch>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
mlflow = ["mlflow>=3.0"]

[project.scripts]
sids-run = "sids_rank_vs_generate.experiment:main"
sasrec-baseline = "sids_rank_vs_generate.experiments.sasrec:main"
sasrec-train = "sids_rank_vs_generate.experiments.sasrec:main"

[tool.setuptools.packages.find]
where = ["src"]
